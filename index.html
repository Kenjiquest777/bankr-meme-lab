<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bankr Meme Lab</title>
<style>
  :root{
    --bg:#0a0e0b; --panel:#101711; --panel2:#0d130e; --line:#1e2b20;
    --acc:#7dfa8c; --acc-dim:#3f7d49; --txt:#d9e6db; --mut:#6f8273;
    --danger:#fa7d7d;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:var(--bg); color:var(--txt);
    font-family:'SF Mono', ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace;
    font-size:13px; line-height:1.45;
    background-image:
      repeating-linear-gradient(0deg, rgba(125,250,140,.015) 0 1px, transparent 1px 3px);
  }
  .wrap{max-width:760px; margin:0 auto; padding:14px 14px 40px;}
  header{
    display:flex; align-items:baseline; justify-content:space-between;
    border-bottom:1px solid var(--line); padding-bottom:10px; margin-bottom:12px;
    flex-wrap:wrap; gap:6px;
  }
  h1{font-size:16px; letter-spacing:1px; color:var(--acc); font-weight:700; text-transform:lowercase;}
  h1 .blink{animation:blink 1.2s steps(1) infinite;}
  @keyframes blink{50%{opacity:0;}}
  .sub{color:var(--mut); font-size:11px;}
  .tabs{display:flex; gap:6px; margin-bottom:12px;}
  .tab{
    background:var(--panel2); border:1px solid var(--line); color:var(--mut);
    padding:6px 14px; cursor:pointer; font-family:inherit; font-size:12px;
    border-radius:3px; transition:all .15s;
  }
  .tab:hover{border-color:var(--acc-dim); color:var(--txt);}
  .tab.on{background:var(--acc); color:#06210c; border-color:var(--acc); font-weight:700;}
  .chips{display:flex; flex-wrap:wrap; gap:5px; margin-bottom:12px;}
  .chip{
    background:transparent; border:1px solid var(--line); color:var(--mut);
    padding:4px 9px; cursor:pointer; font-family:inherit; font-size:11px;
    border-radius:2px; transition:all .12s;
  }
  .chip:hover{color:var(--txt); border-color:var(--acc-dim);}
  .chip.on{background:var(--acc-dim); color:#fff; border-color:var(--acc);}
  .stage{
    background:var(--panel); border:1px solid var(--line);
    border-radius:4px; padding:14px; margin-bottom:14px;
  }
  .fmt{color:var(--acc); font-size:12px; font-weight:700; text-transform:uppercase; margin-bottom:8px; letter-spacing:.5px;}
  .fmt span{color:var(--mut); font-weight:400; text-transform:lowercase; font-size:11px; margin-left:6px;}
  .imgbox{
    position:relative; width:100%; min-height:240px; max-height:480px;
    background:#050806; border:1px solid var(--line); border-radius:3px;
    display:flex; align-items:center; justify-content:center;
    overflow:hidden; margin-bottom:10px;
  }
  .imgbox img{max-width:100%; max-height:480px; object-fit:contain; display:block;}
  .imgbox .loading{color:var(--mut); font-size:11px;}
  .cap{
    background:var(--panel2); border-left:3px solid var(--acc);
    padding:8px 10px; font-size:12px; line-height:1.4; color:var(--txt);
    white-space:pre-wrap; word-break:break-word; margin-bottom:10px;
  }
  .btnrow{display:flex; gap:6px; flex-wrap:wrap;}
  button.act{
    background:var(--panel2); border:1px solid var(--line); color:var(--txt);
    padding:6px 12px; cursor:pointer; font-family:inherit; font-size:11px;
    border-radius:3px; transition:all .15s;
  }
  button.act:hover{border-color:var(--acc); color:var(--acc);}
  button.big{
    background:var(--acc); color:#06210c; border:none;
    font-weight:700; font-size:13px; padding:10px 16px; width:100%;
    cursor:pointer; font-family:inherit; border-radius:3px;
    letter-spacing:.5px; margin-bottom:14px; transition:opacity .15s;
  }
  button.big:hover{opacity:.9;}
  .fallback{
    padding:16px; text-align:center; color:var(--txt); width:100%;
  }
  .fallback .fb-line{font-size:14px; font-weight:700; margin:4px 0; color:var(--acc);}
  .fallback .fb-note{font-size:10px; color:var(--mut); margin-top:8px;}
  label{display:block; font-size:11px; color:var(--mut); margin:8px 0 3px; text-transform:uppercase; letter-spacing:.5px;}
  select, input[type=text]{
    width:100%; background:var(--panel2); border:1px solid var(--line);
    color:var(--txt); font-family:inherit; font-size:12px;
    padding:7px 9px; border-radius:3px; outline:none; margin-bottom:6px;
  }
  select:focus, input[type=text]:focus{border-color:var(--acc);}
  .hint{color:var(--mut); font-size:10px; margin-top:8px; line-height:1.4;}
  .toast{
    position:fixed; bottom:16px; right:16px;
    background:var(--acc); color:#06210c; font-weight:700;
    padding:6px 14px; border-radius:3px; font-size:11px;
    opacity:0; pointer-events:none; transition:opacity .2s; z-index:99;
  }
  .toast.show{opacity:1;}
  .hide{display:none;}
  @media(max-width:480px){ .wrap{padding:10px 8px 30px;} h1{font-size:14px;} }
</style>

  // sanitize text for memegen URL
  function enc(s){
    if (!s || s === '_') return '_';
    return s.trim()
      .replace(/~/g,'--')
      .replace(/-/g,'--')
      .replace(/_/g,'__')
      .replace(/\?/g,'~q')
      .replace(/%/g,'~p')
      .replace(/#/g,'~h')
      .replace(/\//g,'~s')
      .replace(/\\/g,'~b')
      .replace(/</g,'~l')
      .replace(/>/g,'~g')
      .replace(/"/g,"''").replace(/\n/g,'~n').replace(/ /g,'_');
  }

  function memeUrl(tpl, lines, w, bg){
    var targetTpl = tpl;
    var targetBg = bg;
    var targetWidth = w || 1200;

    if (tpl === 'aristocrat') { targetTpl = 'custom'; targetBg = ARISTOCRAT_BG; }
    else if (tpl === 'anakin_custom') {
      targetTpl = 'right';
      targetBg = null;
      var s1 = (lines && lines[0]) ? lines[0] : '_';
      var s2 = (lines && lines[1]) ? lines[1] : '_';
      var s3 = (lines && lines[2]) ? lines[2] : '_';
      lines = [s1, s2, '_', '_', s3];
    }
    else if (tpl === 'bernie_custom') {
      targetTpl = 'custom';
      targetBg = BERNIE_BG;
      var captionText = (lines && lines[0]) ? lines[0].trim() : '';
      var clen = captionText.length;
      
      if (clen < 10) { targetWidth = 1800; }
      else if (clen < 20) { targetWidth = 2600; }
      else if (clen < 35) { targetWidth = 3400; }
      else if (clen < 50) { targetWidth = 4200; }
      else { targetWidth = 5000; }

      lines = ['_', captionText || 'YOUR FINANCIAL SUPPORT'];
    }
    else if (tpl === 'conspiracy_custom') { targetTpl = 'custom'; targetBg = CONSPIRACY_BG; }
    else if (tpl === 'gensler_custom') { targetTpl = 'custom'; targetBg = GENSLER_BG; lines = ['_', lines[0]]; }
    else if (tpl === 'buttons_custom') { targetTpl = 'ds'; targetBg = null; }
    else if (tpl === 'soychad_custom') { targetTpl = 'custom'; targetBg = SOYCHAD_BG; }

    var u = API + targetTpl + '/' + lines.map(enc).join('/') + '.png?width=' + targetWidth + '&font=impact';
    if (targetBg) u += '&background=' + encodeURIComponent(targetBg);
    return u;
  }

  }
  function fallbackCopy(txt){
    try { navigator.clipboard.writeText(txt); } catch(e){
      var ta = document.createElement('textarea'); ta.value = txt;
      document.body.appendChild(ta); ta.select();
      try{ document.execCommand('copy'); }catch(_){}
      document.body.removeChild(ta);
    }
  }
  function openUrl(u){
    if (window.bankr && bankr.openExternal) bankr.openExternal(u);
    else window.open(u, '_blank');
  }

  // ---- random drop ----
  var activeTag = 'all', lastIdx = -1, current = null;

  var chipsEl = document.getElementById('chips');
  TAGS.forEach(function(tag){
    var b = document.createElement('button');
    b.className = 'chip' + (tag==='all' ? ' on' : '');
    b.textContent = tag;
    b.onclick = function(){
      activeTag = tag;
      Array.prototype.forEach.call(chipsEl.children, function(c){ c.classList.remove('on'); });
      b.classList.add('on');
    };
    chipsEl.appendChild(b);
  });

  function pickMeme(){
    var pool = POOL.map(function(m,i){ return {m:m, i:i}; })
      .filter(function(x){ return activeTag==='all' || x.m.tags.indexOf(activeTag) >= 0; });
    if (!pool.length) pool = POOL.map(function(m,i){ return {m:m, i:i}; });
    var candidates = pool.filter(function(x){ return x.i !== lastIdx; });
    if (!candidates.length) candidates = pool;
    var pick = candidates[Math.floor(Math.random()*candidates.length)];
    lastIdx = pick.i;
    return pick.m;
  }

  function showMeme(m){
    var tplCode = m.t;
    if (m.bg === BERNIE_BG) tplCode = 'bernie_custom';
    var u = memeUrl(tplCode, m.l, 1200, m.bg);
    current = { meme: m, url: u };
    document.getElementById('stage').classList.remove('hide');
    document.getElementById('fmtName').innerHTML = m.f + '<span>· ' + m.tags.join(', ') + '</span>';
    var textLines = m.l.filter(function(x){ return x && x !== '_'; }).map(function(x){ return x.toUpperCase(); });
    document.getElementById('capText').textContent = textLines.join('\n');
    renderImg(document.getElementById('imgbox'), u, m.l);
  }

  function renderImg(box, url, lines){
    box.innerHTML = '<div class="loading">rendering...</div>';
    var img = new Image();
    img.onload = function(){ box.innerHTML = ''; box.appendChild(img); };
    img.onerror = function(){
      var fb = document.createElement('div');
      fb.className = 'fallback';
      var textLines = lines.filter(function(x){ return x && x !== '_'; });
      fb.innerHTML = textLines.map(function(x){
        var d = document.createElement('div');
        d.textContent = x;
        return '<div class="fb-line">' + d.innerHTML.toUpperCase() + '</div>';
      }).join('') + '<div class="fb-note">image preview blocked here — use "copy image link" or "open full size", the meme URL works everywhere</div>';
      box.innerHTML = ''; box.appendChild(fb);
    };
    img.src = url;
  }

  document.getElementById('genBtn').onclick = function(){ showMeme(pickMeme()); };
  document.getElementById('copyCap').onclick = function(){
    if (!current) return;
    var textLines = current.meme.l.filter(function(x){ return x && x !== '_'; }).map(function(x){ return x.toUpperCase(); });
    copyText(current.meme.f + '\n' + textLines.join('\n'));
  };
  document.getElementById('copyUrl').onclick = function(){ if (current) copyText(current.url); };
  document.getElementById('openFull').onclick = function(){ if (current) openUrl(memeUrl(current.meme.t === 'custom' && current.meme.bg === BERNIE_BG ? 'bernie_custom' : current.meme.t, current.meme.l, 1400, current.meme.bg)); };
  document.getElementById('remix').onclick = function(){
    var topic = activeTag === 'all' ? '' : ' about ' + activeTag;
    if (window.bankr && bankr.prefillChat) bankr.prefillChat('make me a BANKR meme' + topic);
  };

  // ---- custom builder ----
  var tplSel = document.getElementById('tplSel');
  TPLS.forEach(function(t){
    var o = document.createElement('option');
    o.value = t[0]; o.textContent = t[1] + ' (' + t[2] + (t[2]===1?' line)':' lines)');
    tplSel.appendChild(o);
  });

  var SLOT_LABELS = {
    'dwight': ['False / Question', 'Statement'],
    'aristocrat': ['Top Comment Section', 'Bottom Comment Section'],
    'anakin_custom': ['Top Left Panel Comment (Anakin)', 'Top Right Panel Comment (Padme)', 'Bottom Right Panel Comment (Padme)'],
    'bernie_custom': ['Single-Line Comment Under "I am once again asking" (Auto-scales font)'],
    'conspiracy_custom': ['Top Text Section (Optional)', 'Bottom Text Section (Optional)'],
    'gensler_custom': ['Bottom Comment'],
    'buttons_custom': ['Left Button Comment', 'Right Button Comment', 'Bottom Panel (Sweating Guy) Comment'],
    'soychad_custom': ['Top Comment (Soy Boy Side)', 'Bottom Comment (Yes Chad Side)'],
    'pigeon': ['Guy / Person Label', 'Butterfly / Object Label (Larger Font)', 'Bottom Question Text']
  };

  function buildSlots(){
    var tval = tplSel.value;
    var def = TPLS.filter(function(t){ return t[0] === tval; })[0];
    var n = def ? def[2] : 2;
    var host = document.getElementById('slotInputs');
    host.innerHTML = '';
    
    var customLabels = SLOT_LABELS[tval];

    for (var i = 0; i < n; i++){
      var lb = document.createElement('label');
      lb.textContent = customLabels ? customLabels[i] : ('line ' + (i+1));
      var inp = document.createElement('input'); inp.type = 'text'; inp.maxLength = 100;
      inp.placeholder = customLabels ? customLabels[i] + '...' : (i === 0 ? 'top text...' : 'bottom text...');
      inp.dataset.slot = i;
      host.appendChild(lb); host.appendChild(inp);
    }
  }
  tplSel.onchange = buildSlots;
  buildSlots();

  var customUrl = null;
  document.getElementById('renderBtn').onclick = function(){
    var lines = Array.prototype.map.call(
      document.querySelectorAll('#slotInputs input'),
      function(i){ return (i.value && i.value.trim()) ? i.value.trim() : '_'; }
    );
    
    var tval = tplSel.value;
    if (tval !== 'conspiracy_custom' && !lines.some(function(x){ return x && x.trim() && x !== '_'; })) { 
      toast('type something first'); return; 
    }

    var def = TPLS.filter(function(t){ return t[0] === tval; })[0];
    customUrl = memeUrl(tval, lines, 1200);
    document.getElementById('cstage').classList.remove('hide');
    document.getElementById('cfmtName').textContent = def ? def[1] : tval;
    renderImg(document.getElementById('cimgbox'), customUrl, lines.filter(function(x){ return x && x.trim() && x !== '_'; }));
  };
  document.getElementById('ccopyUrl').onclick = function(){ if (customUrl) copyText(customUrl); };
  document.getElementById('copenFull').onclick = function(){ if (customUrl) openUrl(customUrl); };

  // ---- tabs ----
  var tabR = document.getElementById('tabRandom'), tabC = document.getElementById('tabCustom');
  tabR.onclick = function(){
    tabR.classList.add('on'); tabC.classList.remove('on');
    document.getElementById('viewRandom').classList.remove('hide');
    document.getElementById('viewCustom').classList.add('hide');
  };
  tabC.onclick = function(){
    tabC.classList.add('on'); tabR.classList.remove('on');
    document.getElementById('viewCustom').classList.remove('hide');
    document.getElementById('viewRandom').classList.add('hide');
  };

  // first paint: drop one immediately
  if (window.bankr && bankr.on) {
    bankr.on('ready', function(){ showMeme(pickMeme()); });
    setTimeout(function(){ if (!current) showMeme(pickMeme()); }, 600);
  } else {
    showMeme(pickMeme());
  }
})();
</script>
</body>
</html>
