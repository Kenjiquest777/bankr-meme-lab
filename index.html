<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bankr Meme Lab</title>
<style>
  :root{
    --bg:#0a0e0b; --panel:#101711; --panel2:#0d130e; --line:#1e2b20;
    --acc:#7dfa8c; --acc-dim:#3f7d49; --txt:#d9e6db; --mut:#6f8273;
    --danger:#fa7d7d;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:var(--bg); color:var(--txt);
    font-family:'SF Mono', ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace;
    font-size:13px; line-height:1.45;
    background-image:
      repeating-linear-gradient(0deg, rgba(125,250,140,.015) 0 1px, transparent 1px 3px);
  }
  .wrap{max-width:760px; margin:0 auto; padding:14px 14px 40px;}
  header{
    display:flex; align-items:baseline; justify-content:space-between;
    border-bottom:1px solid var(--line); padding-bottom:10px; margin-bottom:12px;
    flex-wrap:wrap; gap:6px;
  }
  h1{font-size:16px; letter-spacing:1px; color:var(--acc); font-weight:700; text-transform:lowercase;}
  h1 .blink{animation:blink 1.2s steps(1) infinite;}
  @keyframes blink{50%{opacity:0;}}
  .sub{color:var(--mut); font-size:11px;}
  .tabs{display:flex; gap:6px; margin-bottom:12px;}
  .tab{
    background:var(--panel2); border:1px solid var(--line); color:var(--mut);
    padding:6px 14px; cursor:pointer; font-family:inherit; font-size:12px;
    border-radius:3px; transition:all .15s;
  }
  .tab:hover{border-color:var(--acc-dim); color:var(--txt);}
  .tab.on{background:var(--acc); color:#06210c; border-color:var(--acc); font-weight:700;}
  .chips{display:flex; flex-wrap:wrap; gap:5px; margin-bottom:12px;}
  .chip{
    background:transparent; border:1px solid var(--line); color:var(--mut);
    padding:3px 10px; font-size:11px; cursor:pointer; border-radius:99px;
    font-family:inherit; transition:all .15s;
  }
  .chip:hover{border-color:var(--acc-dim); color:var(--txt);}
  .chip.on{border-color:var(--acc); color:var(--acc);}
  .stage{
    background:var(--panel); border:1px solid var(--line); border-radius:6px;
    padding:14px; margin-bottom:12px;
  }
  .fmt{
    color:var(--acc); font-size:11px; text-transform:uppercase; letter-spacing:1.5px;
    margin-bottom:8px;
  }
  .fmt span{color:var(--mut); text-transform:none; letter-spacing:0; margin-left:8px;}
  .imgbox{
    background:#000; border:1px solid var(--line); border-radius:4px;
    display:flex; align-items:center; justify-content:center;
    min-height:200px; overflow:hidden; position:relative; margin-bottom:10px;
  }
  .imgbox img{max-width:100%; max-height:440px; display:block;}
  .loading{color:var(--mut); font-size:12px; padding:40px 0; letter-spacing:1px;}
  .fallback{padding:26px 20px; text-align:center;}
  .fallback .fb-line{font-size:15px; font-weight:700; color:var(--txt); margin:5px 0; text-transform:uppercase;}
  .fallback .fb-note{color:var(--mut); font-size:11px; margin-top:14px;}
  .cap{
    background:var(--panel2); border:1px solid var(--line); border-radius:4px;
    padding:10px 12px; margin-bottom:10px; white-space:pre-wrap; font-size:12.5px;
    color:var(--txt);
  }
  .btnrow{display:flex; flex-wrap:wrap; gap:6px;}
  button.act{
    background:var(--panel2); border:1px solid var(--acc-dim); color:var(--acc);
    padding:7px 14px; cursor:pointer; font-family:inherit; font-size:12px;
    border-radius:3px; transition:all .15s;
  }
  button.act:hover{background:var(--acc); color:#06210c; border-color:var(--acc);}
  button.big{
    width:100%; padding:12px; font-size:14px; font-weight:700;
    background:var(--acc); color:#06210c; border:none; border-radius:4px;
    cursor:pointer; font-family:inherit; letter-spacing:1px; margin-bottom:12px;
    transition:transform .08s, filter .15s;
  }
  button.big:hover{filter:brightness(1.1);}
  button.big:active{transform:scale(.985);}
  .toast{
    position:fixed; bottom:16px; left:50%; transform:translateX(-50%);
    background:var(--acc); color:#06210c; padding:7px 16px; border-radius:3px;
    font-size:12px; font-weight:700; opacity:0; pointer-events:none;
    transition:opacity .2s; z-index:9;
  }
  .toast.show{opacity:1;}
  label{display:block; color:var(--mut); font-size:11px; margin:10px 0 4px; text-transform:uppercase; letter-spacing:1px;}
  select, input[type=text]{
    width:100%; background:var(--panel2); border:1px solid var(--line); color:var(--txt);
    padding:8px 10px; font-family:inherit; font-size:12.5px; border-radius:3px; outline:none;
  }
  select:focus, input:focus{border-color:var(--acc-dim);}
  .hint{color:var(--mut); font-size:11px; margin-top:10px;}
  .hide{display:none;}
  @media(max-width:480px){ .wrap{padding:10px 8px 30px;} h1{font-size:14px;} }
</style>

</div>

  function enc(t){
    if(!t || !t.trim() || t.trim() === '_') return '_';
    var text = t.trim();
    text = text.toUpperCase();
    return text
      .replace(/_/g,'__').replace(/-/g,'--')
      .replace(/\?/g,'~q').replace(/&/g,'~a').replace(/%/g,'~p')
      .replace(/#/g,'~h').replace(/\//g,'~s').replace(/\\/g,'~b')
      .replace(/"/g,"''").replace(/\n/g,'~n').replace(/ /g,'_');
  }

  function memeUrl(tpl, lines, w, bg){
    var targetTpl = tpl;
    var targetBg = bg;
    var targetWidth = w || 1200;

    if (tpl === 'aristocrat') { targetTpl = 'custom'; targetBg = ARISTOCRAT_BG; }
    else if (tpl === 'anakin_custom') {
      targetTpl = 'right';
      targetBg = null;
      var s1 = (lines && lines[0]) ? lines[0] : '_';
      var s2 = (lines && lines[1]) ? lines[1] : '_';
      var s3 = (lines && lines[2]) ? lines[2] : '_';
      lines = [s1, s2, '_', '_', s3];
    }
    else if (tpl === 'bernie_custom') {
      targetTpl = 'custom';
      targetBg = BERNIE_BG;
      var captionText = (lines && lines[0]) ? lines[0].trim() : '';
      var clen = captionText.length;
      
      if (clen < 10) { targetWidth = 1800; }
      else if (clen < 20) { targetWidth = 2600; }
      else if (clen < 35) { targetWidth = 3400; }
      else if (clen < 50) { targetWidth = 4200; }
      else { targetWidth = 5000; }

      lines = ['_', captionText || 'YOUR FINANCIAL SUPPORT'];
    }
    else if (tpl === 'conspiracy_custom') { targetTpl = 'custom'; targetBg = CONSPIRACY_BG; }
    else if (tpl === 'gensler_custom') { targetTpl = 'custom'; targetBg = GENSLER_BG; lines = ['_', lines[0]]; }
    else if (tpl === 'buttons_custom') { targetTpl = 'ds'; targetBg = null; }
    else if (tpl === 'soychad_custom') { targetTpl = 'custom'; targetBg = SOYCHAD_BG; }

    var u = API + targetTpl + '/' + lines.map(enc).join('/') + '.png?width=' + targetWidth + '&font=impact';
    if (targetBg) u += '&background=' + encodeURIComponent(targetBg);
    return u;
  }

  function toast(msg){
    var el = document.getElementById('toast');
    el.textContent = msg; el.classList.add('show');
    setTimeout(function(){ el.classList.remove('show'); }, 1400);
  }
  function copyText(txt){
    var done = function(){ toast('copied'); };
    if (window.bankr && bankr.copy) { bankr.copy(txt).then(done).catch(function(){ fallbackCopy(txt); done(); }); }
    else { fallbackCopy(txt); done(); }
  }
  function fallbackCopy(txt){
    try { navigator.clipboard.writeText(txt); } catch(e){
      var ta = document.createElement('textarea'); ta.value = txt;
      document.body.appendChild(ta); ta.select();
      try{ document.execCommand('copy'); }catch(_){}
      document.body.removeChild(ta);
    }
  }
  function openUrl(u){
    if (window.bankr && bankr.openExternal) bankr.openExternal(u);
    else window.open(u, '_blank');
  }

  function pickMeme(){
    var pool = POOL.map(function(m,i){ return {m:m, i:i}; })
      .filter(function(x){ return activeTag==='all' || x.m.tags.indexOf(activeTag) >= 0; });
    if (!pool.length) pool = POOL.map(function(m,i){ return {m:m, i:i}; });
    var candidates = pool.filter(function(x){ return x.i !== lastIdx; });
    if (!candidates.length) candidates = pool;
    var pick = candidates[Math.floor(Math.random()*candidates.length)];
    lastIdx = pick.i;
    return pick.m;
  }

  function showMeme(m){
    var tplCode = m.t;

  }

      }).join('') + '<div class="fb-note">image preview blocked here — use "copy image link" or "open full size", the meme URL works everywhere</div>';
      box.innerHTML = ''; box.appendChild(fb);
    };
    img.src = url;
  }

      inp.dataset.slot = i;
      host.appendChild(lb); host.appendChild(inp);
    }
  }
