<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bankr Meme Lab</title>
<style>
  :root{
    --bg:#0a0e0b; --panel:#101711; --panel2:#0d130e; --line:#1e2b20;
    --acc:#7dfa8c; --acc-dim:#3f7d49; --txt:#d9e6db; --mut:#6f8273;
    --danger:#fa7d7d;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:var(--bg); color:var(--txt);
    font-family:'SF Mono', ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace;
    font-size:13px; line-height:1.45;
    background-image:
      repeating-linear-gradient(0deg, rgba(125,250,140,.015) 0 1px, transparent 1px 3px);
  }
  .wrap{max-width:760px; margin:0 auto; padding:14px 14px 40px;}
  header{
    display:flex; align-items:baseline; justify-content:space-between;
    border-bottom:1px solid var(--line); padding-bottom:10px; margin-bottom:12px;
    flex-wrap:wrap; gap:6px;
  }
  h1{font-size:16px; letter-spacing:1px; color:var(--acc); font-weight:700; text-transform:lowercase;}
  h1 .blink{animation:blink 1.2s steps(1) infinite;}
  @keyframes blink{50%{opacity:0;}}
  .sub{color:var(--mut); font-size:11px;}
  .tabs{display:flex; gap:6px; margin-bottom:12px;}
  .tab{
    background:var(--panel2); border:1px solid var(--line); color:var(--mut);
    padding:6px 14px; cursor:pointer; font-family:inherit; font-size:12px;
    border-radius:3px; transition:all .15s;
  }
  .tab:hover{border-color:var(--acc-dim); color:var(--txt);}
  .tab.on{background:var(--acc); color:#06210c; border-color:var(--acc); font-weight:700;}
  .chips{display:flex; flex-wrap:wrap; gap:5px; margin-bottom:12px;}
  .chip{
    background:transparent; border:1px solid var(--line); color:var(--mut);
    padding:3px 10px; font-size:11px; cursor:pointer; border-radius:99px;
    font-family:inherit; transition:all .15s;
  }
  .chip:hover{border-color:var(--acc-dim); color:var(--txt);}
  .chip.on{border-color:var(--acc); color:var(--acc);}
  .stage{
    background:var(--panel); border:1px solid var(--line); border-radius:6px;
    padding:14px; margin-bottom:12px;
  }
  .fmt{
    color:var(--acc); font-size:11px; text-transform:uppercase; letter-spacing:1.5px;
    margin-bottom:8px;
  }
  .fmt span{color:var(--mut); text-transform:none; letter-spacing:0; margin-left:8px;}
  .imgbox{
    background:#000; border:1px solid var(--line); border-radius:4px;
    display:flex; align-items:center; justify-content:center;
    min-height:200px; overflow:hidden; position:relative; margin-bottom:10px;
  }
  .imgbox img{max-width:100%; max-height:440px; display:block;}
  .loading{color:var(--mut); font-size:12px; padding:40px 0; letter-spacing:1px;}
  .fallback{padding:26px 20px; text-align:center;}
  .fallback .fb-line{font-size:15px; font-weight:700; color:var(--txt); margin:5px 0; text-transform:uppercase;}
  .fallback .fb-note{color:var(--mut); font-size:11px; margin-top:14px;}
  .cap{
    background:var(--panel2); border:1px solid var(--line); border-radius:4px;
    padding:10px 12px; margin-bottom:10px; white-space:pre-wrap; font-size:12.5px;
    color:var(--txt);
  }
  .btnrow{display:flex; flex-wrap:wrap; gap:6px;}
  button.act{
    background:var(--panel2); border:1px solid var(--acc-dim); color:var(--acc);
    padding:7px 14px; cursor:pointer; font-family:inherit; font-size:12px;
    border-radius:3px; transition:all .15s;
  }
  button.act:hover{background:var(--acc); color:#06210c; border-color:var(--acc);}
  button.big{
    width:100%; padding:12px; font-size:14px; font-weight:700;
    background:var(--acc); color:#06210c; border:none; border-radius:4px;
    cursor:pointer; font-family:inherit; letter-spacing:1px; margin-bottom:12px;
    transition:transform .08s, filter .15s;
  }
  button.big:hover{filter:brightness(1.1);}
  button.big:active{transform:scale(.985);}
  .toast{
    position:fixed; bottom:16px; left:50%; transform:translateX(-50%);
    background:var(--acc); color:#06210c; padding:7px 16px; border-radius:3px;
    font-size:12px; font-weight:700; opacity:0; pointer-events:none;
    transition:opacity .2s; z-index:9;
  }
  .toast.show{opacity:1;}
  label{display:block; color:var(--mut); font-size:11px; margin:10px 0 4px; text-transform:uppercase; letter-spacing:1px;}
  select, input[type=text]{
    width:100%; background:var(--panel2); border:1px solid var(--line); color:var(--txt);
    padding:8px 10px; font-family:inherit; font-size:12.5px; border-radius:3px; outline:none;
  }
  select:focus, input:focus{border-color:var(--acc-dim);}
  .hint{color:var(--mut); font-size:11px; margin-top:10px;}
  .hide{display:none;}
  @media(max-width:480px){ .wrap{padding:10px 8px 30px;} h1{font-size:14px;} }
</style>

      for (var i=0;i<boxes.length;i++) boxes[i].style.fontSize = fs+'px';
    }
    function pvMakeDraggable(el, idx){
      var sx=0, sy=0, ofx=0, ofy=0, drag=false;
      el.addEventListener('pointerdown', function(e){
        drag = true; sx = e.clientX; sy = e.clientY;
        ofx = pvState.pos[idx].fx; ofy = pvState.pos[idx].fy;
        el.classList.add('drag');
        try { el.setPointerCapture(e.pointerId); } catch(_){}
        e.preventDefault();
      });
      el.addEventListener('pointermove', function(e){
        if (!drag || !pvState.wrap) return;
        var r = pvState.wrap.getBoundingClientRect();
        if (!r.width || !r.height) return;
        var fx = Math.min(.97, Math.max(.03, ofx + (e.clientX-sx)/r.width));
        var fy = Math.min(.97, Math.max(.03, ofy + (e.clientY-sy)/r.height));
        pvState.pos[idx].fx = fx; pvState.pos[idx].fy = fy;
        el.style.left = (fx*100)+'%'; el.style.top = (fy*100)+'%';
      });
      var stop = function(){ if (!drag) return; drag = false; el.classList.remove('drag'); };
      el.addEventListener('pointerup', stop);
      el.addEventListener('pointercancel', stop);
      el.addEventListener('dblclick', function(){
        var d = pvDefaults(pvState.tpl, pvState.n)[idx];
        if (!d) return;
        pvState.pos[idx].fx = d.fx; pvState.pos[idx].fy = d.fy;
        el.style.left = (d.fx*100)+'%'; el.style.top = (d.fy*100)+'%';
      });
    }
    function pvWrapLines(c2, text, maxW){
      var words = text.split(/\s+/), lines = [], cur = '';
      for (var i=0;i<words.length;i++){
        var t = cur ? cur+' '+words[i] : words[i];
        if (cur && c2.measureText(t).width > maxW){ lines.push(cur); cur = words[i]; }
        else cur = t;
      }
      if (cur) lines.push(cur);
      return lines.length ? lines : [''];
    }
    function pvDrawLine(c2, text, cx, cy, W){
      var fs = Math.max(18, Math.round(W/13));
      c2.font = 'bold '+fs+'px Impact, "Arial Black", sans-serif';
      var lines = pvWrapLines(c2, text, W*0.92);
      while (lines.length > 3 && fs > W/30){
        fs = Math.round(fs*0.85);
        c2.font = 'bold '+fs+'px Impact, "Arial Black", sans-serif';
        lines = pvWrapLines(c2, text, W*0.92);
      }
      c2.textAlign = 'center'; c2.textBaseline = 'middle'; c2.lineJoin = 'round';
      c2.lineWidth = Math.max(2, fs/10); c2.strokeStyle = '#000'; c2.fillStyle = '#fff';
      var lh = fs*1.08, y0 = cy - (lines.length-1)*lh/2;
      for (var j=0;j<lines.length;j++){
        c2.strokeText(lines[j], cx, y0+j*lh);
        c2.fillText(lines[j], cx, y0+j*lh);
      }
    }
    function pvComposite(src){
      var inputs = document.querySelectorAll('#slotInputs input');
      var W = Math.min(src.naturalWidth || 1200, 1600);
      var H = Math.round((src.naturalHeight || 630) * (W/(src.naturalWidth || 1200)));
      var canvas = document.createElement('canvas');
      canvas.width = W; canvas.height = H;
      var c2 = canvas.getContext('2d');
      c2.drawImage(src, 0, 0, W, H);
      var boxes = pvState.wrap.querySelectorAll('.pv-box');
      for (var i=0;i<boxes.length;i++){
        var v = (inputs[i] && inputs[i].value) ? inputs[i].value.trim() : '';
        if (v) pvDrawLine(c2, v.toUpperCase(), pvState.pos[i].fx*W, pvState.pos[i].fy*H, W);
      }
      var out = new Image();
      out.src = canvas.toDataURL('image/png');
      out.style.maxWidth = '100%';
      out.style.maxHeight = '440px';
      var cb = document.getElementById('cimgbox');
      cb.innerHTML = '';
      cb.appendChild(out);
      document.getElementById('cstage').classList.remove('hide');
      document.getElementById('cfmtName').textContent = 'your placement';
      document.getElementById('ccopyUrl').classList.add('hide');
      document.getElementById('copenFull').classList.add('hide');
      document.getElementById('pvSaveNote').classList.remove('hide');
      try { document.getElementById('cstage').scrollIntoView({behavior:'smooth', block:'nearest'}); } catch(_){}
    }
    function pvRebuild(){
      if (pvState.tpl && pvState.pos.length) pvPosCache[pvState.tpl] = pvState.pos;
      var tval = tplSel.value;
      var def = null;
      for (var i=0;i<TPLS.length;i++){ if (TPLS[i][0] === tval){ def = TPLS[i]; break; } }
      var n = def ? def[2] : 2;
      pvState = { tpl:tval, n:n, bgUrl:pvBgUrl(tval, n), wrap:null, ximg:null, pos:(pvPosCache[tval] || pvDefaults(tval, n)), ready:false };
      pvRender();
    }
    pvInjectCss();
    if (pvInjectDom()){
      pvBox = document.getElementById('pvBox');
      document.getElementById('pvSave').onclick = function(){
        if (!pvState.wrap){ toast('preview not ready'); return; }
        var inputs = document.querySelectorAll('#slotInputs input');
        var any = false;
        for (var i=0;i<inputs.length;i++){ if (inputs[i].value && inputs[i].value.trim()){ any = true; break; } }
        if (!any){ toast('type something first'); return; }
        var go = function(src){
          try { pvComposite(src); }
          catch(err){ toast('direct save blocked for this template — use render + copy link'); }
        };
        if (pvState.ximg && pvState.ximg.naturalWidth){ go(pvState.ximg); return; }
        var x = new Image();
        x.crossOrigin = 'anonymous';
        x.onload = function(){ pvState.ximg = x; go(x); };
        x.onerror = function(){ toast('this template blocks direct save — use render + copy link'); };
        x.src = pvState.bgUrl;
      };
      document.getElementById('pvReset').onclick = function(){
        if (!pvState.wrap) return;
        pvState.pos = pvDefaults(pvState.tpl, pvState.n);
        var boxes = pvState.wrap.querySelectorAll('.pv-box');
        for (var i=0;i<boxes.length;i++){
          boxes[i].style.left = (pvState.pos[i].fx*100)+'%';
          boxes[i].style.top = (pvState.pos[i].fy*100)+'%';
        }
      };
      var renderBtnEl = document.getElementById('renderBtn');
      var origRender = renderBtnEl.onclick;
      renderBtnEl.onclick = function(){
        document.getElementById('ccopyUrl').classList.remove('hide');
        document.getElementById('copenFull').classList.remove('hide');
        document.getElementById('pvSaveNote').classList.add('hide');
        if (origRender) origRender();
        pvSyncText();
      };
      tplSel.addEventListener('change', pvRebuild);
      var slotHost = document.getElementById('slotInputs');
      if (slotHost) slotHost.addEventListener('input', pvSyncText);
      window.addEventListener('resize', pvFitFont);
      if (window.ResizeObserver){ try { new ResizeObserver(pvFitFont).observe(pvBox); } catch(_){} }
      pvRebuild();
    }
  })();

  // first paint: drop one immediately
  if (window.bankr && bankr.on) {
    bankr.on('ready', function(){ showMeme(pickMeme()); });
    setTimeout(function(){ if (!current) showMeme(pickMeme()); }, 600);
  } else {
    showMeme(pickMeme());
  }
})();
</script>
</body>
