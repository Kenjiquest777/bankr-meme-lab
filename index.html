<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bankr Meme Lab</title>
<style>
  :root{
    --bg:#0a0e0b; --panel:#101711; --panel2:#0d130e; --line:#1e2b20;
    --acc:#7dfa8c; --acc-dim:#3f7d49; --txt:#d9e6db; --mut:#6f8273;
    --danger:#fa7d7d;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:var(--bg); color:var(--txt);
    font-family:'SF Mono', ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace;
    font-size:13px; line-height:1.45;
    background-image:
      repeating-linear-gradient(0deg, rgba(125,250,140,.015) 0 1px, transparent 1px 3px);
  }
  .wrap{max-width:760px; margin:0 auto; padding:14px 14px 40px;}
  header{
    display:flex; align-items:baseline; justify-content:space-between;
    border-bottom:1px solid var(--line); padding-bottom:10px; margin-bottom:12px;
    flex-wrap:wrap; gap:6px;
  }
  h1{font-size:16px; letter-spacing:1px; color:var(--acc); font-weight:700; text-transform:lowercase;}
  h1 .blink{animation:blink 1.2s steps(1) infinite;}
  @keyframes blink{50%{opacity:0;}}
  .sub{color:var(--mut); font-size:11px;}
  .tabs{display:flex; gap:6px; margin-bottom:12px;}
  .tab{
    background:var(--panel2); border:1px solid var(--line); color:var(--mut);
    padding:6px 14px; cursor:pointer; font-family:inherit; font-size:12px;
    border-radius:3px; transition:all .15s;
  }
  .tab:hover{border-color:var(--acc-dim); color:var(--txt);}
  .tab.on{background:var(--acc); color:#06210c; border-color:var(--acc); font-weight:700;}
  .chips{display:flex; flex-wrap:wrap; gap:5px; margin-bottom:12px;}
  .chip{
    background:transparent; border:1px solid var(--line); color:var(--mut);
    padding:3px 10px; font-size:11px; cursor:pointer; border-radius:99px;
    font-family:inherit; transition:all .15s;
  }
  .chip:hover{border-color:var(--acc-dim); color:var(--txt);}
  .chip.on{border-color:var(--acc); color:var(--acc);}
  .stage{
    background:var(--panel); border:1px solid var(--line); border-radius:6px;
    padding:14px; margin-bottom:12px;
  }
  .fmt{
    color:var(--acc); font-size:11px; text-transform:uppercase; letter-spacing:1.5px;
    margin-bottom:8px;
  }
  .fmt span{color:var(--mut); text-transform:none; letter-spacing:0; margin-left:8px;}
  .imgbox{
    background:#000; border:1px solid var(--line); border-radius:4px;
    display:flex; align-items:center; justify-content:center;
    min-height:200px; overflow:hidden; position:relative; margin-bottom:10px;
  }
  .imgbox img{max-width:100%; max-height:440px; display:block;}
  .loading{color:var(--mut); font-size:12px; padding:40px 0; letter-spacing:1px;}
  .fallback{padding:26px 20px; text-align:center;}
  .fallback .fb-line{font-size:15px; font-weight:700; color:var(--txt); margin:5px 0; text-transform:uppercase;}
  .fallback .fb-note{color:var(--mut); font-size:11px; margin-top:14px;}
  .cap{
    background:var(--panel2); border:1px solid var(--line); border-radius:4px;
    padding:10px 12px; margin-bottom:10px; white-space:pre-wrap; font-size:12.5px;
    color:var(--txt);
  }
  .btnrow{display:flex; flex-wrap:wrap; gap:6px;}
  button.act{
    background:var(--panel2); border:1px solid var(--acc-dim); color:var(--acc);
    padding:7px 14px; cursor:pointer; font-family:inherit; font-size:12px;
    border-radius:3px; transition:all .15s;
  }
  button.act:hover{background:var(--acc); color:#06210c; border-color:var(--acc);}
  button.big{
    width:100%; padding:12px; font-size:14px; font-weight:700;
    background:var(--acc); color:#06210c; border:none; border-radius:4px;
    cursor:pointer; font-family:inherit; letter-spacing:1px; margin-bottom:12px;
    transition:transform .08s, filter .15s;
  }
  button.big:hover{filter:brightness(1.1);}
  button.big:active{transform:scale(.985);}
  .toast{
    position:fixed; bottom:16px; left:50%; transform:translateX(-50%);
    background:var(--acc); color:#06210c; padding:7px 16px; border-radius:3px;
    font-size:12px; font-weight:700; opacity:0; pointer-events:none;
    transition:opacity .2s; z-index:9;
  }
  .toast.show{opacity:1;}
  label{display:block; color:var(--mut); font-size:11px; margin:10px 0 4px; text-transform:uppercase; letter-spacing:1px;}
  select, input[type=text]{
    width:100%; background:var(--panel2); border:1px solid var(--line); color:var(--txt);
    padding:8px 10px; font-family:inherit; font-size:12.5px; border-radius:3px; outline:none;
  }
  select:focus, input:focus{border-color:var(--acc-dim);}
  .hint{color:var(--mut); font-size:11px; margin-top:10px;}
  .hide{display:none;}
  @media(max-width:480px){ .wrap{padding:10px 8px 30px;} h1{font-size:14px;} }
</style>
</head>

    </div>

</div>

    ['spongebob','mocking spongebob',2], ['oprah','oprah',2], ['buzz','buzz lightyear',2],
    ['rollsafe','roll safe',2], ['success','success kid',2], ['philosoraptor','philosoraptor',2],
    ['cmm','change my mind',1], ['panik-kalm-panik','panik kalm panik',3],
    ['woman-cat','woman yelling at cat',2], ['yodawg','yo dawg',2], ['wonka','condescending wonka',2],
    ['harold','hide the pain harold',2], ['grumpycat','grumpy cat',2], ['joker','joker',2],
    ['astronaut','always has been',2], ['disastergirl','disaster girl',2], ['sadfrog','sad frog / wojak feels',2],
    ['midwit','mid curve (midwit)',3], ['gb','galaxy brain',4], ['feelsgood','feels good man',2], ['cryingfloor','crying wojak',2],
    ['evergreen','evergreen ship & bulldozer',2], ['train','train hitting bus',2], ['priest','priest & girl (naughty girl)',3],
    ['superiority','signature look of superiority (aristocrats)',2], ['oof','ooof / big oof',2]
  ];

  function enc(t){
    if(!t || !t.trim()) return '_';
    return t.trim()
      .replace(/_/g,'__').replace(/-/g,'--')
      .replace(/\?/g,'~q').replace(/&/g,'~a').replace(/%/g,'~p')
      .replace(/#/g,'~h').replace(/\//g,'~s').replace(/\\/g,'~b')
      .replace(/"/g,"''").replace(/\n/g,'~n').replace(/ /g,'_');
  }
  function memeUrl(tpl, lines, w, bg){
    var u = API + tpl + '/' + lines.map(enc).join('/') + '.png?width=' + (w||700);
    if (bg) u += '&background=' + encodeURIComponent(bg);
    return u;
  }
  function toast(msg){
    var el = document.getElementById('toast');
    el.textContent = msg; el.classList.add('show');
    setTimeout(function(){ el.classList.remove('show'); }, 1400);
  }
  function copyText(txt){
    var done = function(){ toast('copied'); };
    if (window.bankr && bankr.copy) { bankr.copy(txt).then(done).catch(function(){ fallbackCopy(txt); done(); }); }
    else { fallbackCopy(txt); done(); }
  }
  function fallbackCopy(txt){
    try { navigator.clipboard.writeText(txt); } catch(e){
      var ta = document.createElement('textarea'); ta.value = txt;
      document.body.appendChild(ta); ta.select();
      try{ document.execCommand('copy'); }catch(_){}
      document.body.removeChild(ta);
    }
  }
  function openUrl(u){
    if (window.bankr && bankr.openExternal) bankr.openExternal(u);
    else window.open(u, '_blank');
  }

  // ---- random drop ----
  var activeTag = 'all', lastIdx = -1, current = null;

  var chipsEl = document.getElementById('chips');
  TAGS.forEach(function(tag){
    var b = document.createElement('button');
    b.className = 'chip' + (tag==='all' ? ' on' : '');
    b.textContent = tag;
    b.onclick = function(){
      activeTag = tag;
      Array.prototype.forEach.call(chipsEl.children, function(c){ c.classList.remove('on'); });
      b.classList.add('on');
    };
    chipsEl.appendChild(b);
  });

  function pickMeme(){
    var pool = POOL.map(function(m,i){ return {m:m, i:i}; })
      .filter(function(x){ return activeTag==='all' || x.m.tags.indexOf(activeTag) >= 0; });
    if (!pool.length) pool = POOL.map(function(m,i){ return {m:m, i:i}; });
    var candidates = pool.filter(function(x){ return x.i !== lastIdx; });
    if (!candidates.length) candidates = pool;
    var pick = candidates[Math.floor(Math.random()*candidates.length)];
    lastIdx = pick.i;
    return pick.m;
  }

  function showMeme(m){
    current = { meme: m, url: memeUrl(m.t, m.l, 700, m.bg) };
    document.getElementById('stage').classList.remove('hide');
    document.getElementById('fmtName').innerHTML = m.f + '<span>· ' + m.tags.join(', ') + '</span>';
    document.getElementById('capText').textContent = m.l.map(function(x){ return x.toUpperCase(); }).join('\n');
    renderImg(document.getElementById('imgbox'), current.url, m.l);
  }

  function renderImg(box, url, lines){
    box.innerHTML = '<div class="loading">rendering...</div>';
    var img = new Image();
    img.onload = function(){ box.innerHTML = ''; box.appendChild(img); };
    img.onerror = function(){
      var fb = document.createElement('div');
      fb.className = 'fallback';
      fb.innerHTML = lines.map(function(x){
        var d = document.createElement('div');
        d.textContent = x;
        return '<div class="fb-line">' + d.innerHTML.toUpperCase() + '</div>';
      }).join('') + '<div class="fb-note">image preview blocked here — use "copy image link" or "open full size", the meme URL works everywhere</div>';
      box.innerHTML = ''; box.appendChild(fb);
    };
    img.src = url;
  }

  document.getElementById('genBtn').onclick = function(){ showMeme(pickMeme()); };
  document.getElementById('copyCap').onclick = function(){
    if (!current) return;
    copyText(current.meme.f + '\n' + current.meme.l.map(function(x){ return x.toUpperCase(); }).join('\n'));
  };
  document.getElementById('copyUrl').onclick = function(){ if (current) copyText(current.url); };
  document.getElementById('openFull').onclick = function(){ if (current) openUrl(memeUrl(current.meme.t, current.meme.l, 1000, current.meme.bg)); };
  document.getElementById('remix').onclick = function(){
    var topic = activeTag === 'all' ? '' : ' about ' + activeTag;
    if (window.bankr && bankr.prefillChat) bankr.prefillChat('make me a BANKR meme' + topic);
  };

  // ---- custom builder ----
  var tplSel = document.getElementById('tplSel');
  TPLS.forEach(function(t){
    var o = document.createElement('option');
    o.value = t[0]; o.textContent = t[1] + ' (' + t[2] + (t[2]===1?' line)':' lines)');
    tplSel.appendChild(o);
  });
  function buildSlots(){
    var def = TPLS.filter(function(t){ return t[0] === tplSel.value; })[0];
    var n = def ? def[2] : 2;
    var host = document.getElementById('slotInputs');
    host.innerHTML = '';
    for (var i = 0; i < n; i++){
      var lb = document.createElement('label'); lb.textContent = 'line ' + (i+1);
      var inp = document.createElement('input'); inp.type = 'text'; inp.maxLength = 100;
      inp.placeholder = i === 0 ? 'top text...' : 'line ' + (i+1) + ' text...';
      inp.dataset.slot = i;
      host.appendChild(lb); host.appendChild(inp);
    }
  }
  tplSel.onchange = buildSlots;
  buildSlots();

  var customUrl = null;
  document.getElementById('renderBtn').onclick = function(){
    var lines = Array.prototype.map.call(
      document.querySelectorAll('#slotInputs input'),
      function(i){ return i.value; }
    );
    if (!lines.some(function(x){ return x && x.trim(); })) { toast('type something first'); return; }
    var def = TPLS.filter(function(t){ return t[0] === tplSel.value; })[0];
    customUrl = memeUrl(tplSel.value, lines, 700);
    document.getElementById('cstage').classList.remove('hide');
    document.getElementById('cfmtName').textContent = def ? def[1] : tplSel.value;
    renderImg(document.getElementById('cimgbox'), customUrl, lines.filter(function(x){ return x && x.trim(); }));
  };
  document.getElementById('ccopyUrl').onclick = function(){ if (customUrl) copyText(customUrl); };
  document.getElementById('copenFull').onclick = function(){ if (customUrl) openUrl(customUrl.replace('width=700','width=1000')); };

  // ---- tabs ----
  var tabR = document.getElementById('tabRandom'), tabC = document.getElementById('tabCustom');
  tabR.onclick = function(){
    tabR.classList.add('on'); tabC.classList.remove('on');
    document.getElementById('viewRandom').classList.remove('hide');
    document.getElementById('viewCustom').classList.add('hide');
  };
  tabC.onclick = function(){
    tabC.classList.add('on'); tabR.classList.remove('on');
    document.getElementById('viewCustom').classList.remove('hide');
    document.getElementById('viewRandom').classList.add('hide');
  };

  // first paint: drop one immediately
  if (window.bankr && bankr.on) {
    bankr.on('ready', function(){ showMeme(pickMeme()); });
    // in case ready already fired
    setTimeout(function(){ if (!current) showMeme(pickMeme()); }, 600);
  } else {
    showMeme(pickMeme());
  }
})();
</script>
</body>
</html>
